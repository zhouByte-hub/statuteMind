server:
  port: 9527
  servlet:
    context-path: /statuteMind
spring:
  application:
    name: core
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:3b-instruct
      embedding:
        model: nomic-embed-text
  data:
    redis:
      host: localhost
      port: 16379
      database: 0

scorpio:
  import:
    support:
      - md
      - markdown
      - docx
      - xlsx
      - xlsm
      - pdf
    import-file-size: 10
